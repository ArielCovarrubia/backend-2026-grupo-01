[project]
name = "backend-2026-grupo-01"
version = "0.1.0"
description = "Proyecto Backend - Grupo 01"
readme = "README.md"
authors = [
    { name = "beatmartin", email = "bmartin2026@alu.uct.cl" }
]
requires-python = ">=3.14.7"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
